name: Commit messages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_HEAD~0 -1"
          else
            range="$PUSH_BEFORE..$PUSH_HEAD"
          fi
          status=0
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            echo "Checking $sha"
            bash .githooks/commit-msg /tmp/msg.txt || status=1
          done
          exit $status
